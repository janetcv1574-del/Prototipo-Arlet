<title>Arlet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Arlet es tu mano derecha para que el trabajo, los estudios y tu vida encajen. Ordena tus pendientes, recuerda tus metas y te conoce con el tiempo.">
<meta property="og:title" content="Arlet: todo lo que llevas en la cabeza, en un solo lugar">
<meta property="og:description" content="Tu mano derecha para que el trabajo, los estudios y tu vida encajen. Tú decides cuánto hace Arlet por su cuenta.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_PE">
<meta name="theme-color" content="#16324F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap">
<style>
/* Layout: barra lateral Azul Profundo + contenido sobre canvas cálido (escritorio 1440);
   en tablet y móvil la barra lateral pasa a barra inferior. Tokens = DESIGN.md de Arlet. */
:root{
  --color-primary-900:#16324F; --color-primary-600:#2457C5; --color-primary-100:#E6EEFB;
  --color-accent-500:#F2A93B; --color-accent-100:#FDF1DC;
  --color-ink:#121826; --color-gray-700:#374151; --color-gray-500:#6B7280; --color-gray-300:#D1D5DB; --color-gray-100:#F3F4F6;
  --color-canvas:#F8F7F4; --color-surface:#FFFFFF;
  --color-success:#1F8A5B; --color-success-bg:#E5F4EC;
  --color-warning:#B7791F; --color-warning-bg:#FBF0DD;
  --color-error:#C23B3B;   --color-error-bg:#FBE7E7;
  --color-info:#2457C5;    --color-info-bg:#E6EEFB;
  --cat-work:#2457C5; --cat-study:#6B5BD2; --cat-personal:#F2A93B;
  --nav-bg:#16324F; --nav-fg:#C9D6E6; --nav-active:#FFFFFF; --nav-hover:rgba(255,255,255,.08);
  --on-primary:#FFFFFF; --scrim:rgba(18,24,38,.45);
  --font-heading:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;
  --radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-xl:24px;--radius-full:999px;
  --shadow-1:0 1px 2px rgba(22,50,79,.06),0 1px 3px rgba(22,50,79,.08);
  --shadow-2:0 4px 12px rgba(22,50,79,.10);
  --shadow-3:0 12px 32px rgba(22,50,79,.16);
  --duration-fast:150ms;--duration-base:250ms;--ease-out:cubic-bezier(.2,.8,.2,1);
  --fs-display:32px;--fs-h1:24px;--fs-h2:20px;
}
@media (min-width:1024px){:root{--fs-display:40px;--fs-h1:30px;--fs-h2:25px}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-primary-600:#6C9BFF;--color-primary-100:#1B2D4D;--color-accent-500:#F5B85A;--color-accent-100:#3A2E17;
  --color-ink:#EEF1F6;--color-gray-700:#C5CCD6;--color-gray-500:#9AA4B2;--color-gray-300:#2C3A4D;--color-gray-100:#1E2A3B;
  --color-canvas:#0E1624;--color-surface:#16202F;
  --color-success:#4CC38A;--color-success-bg:#143326;--color-warning:#E0A64B;--color-warning-bg:#3A2E17;
  --color-error:#F07A7A;--color-error-bg:#3D1C1F;--color-info:#6C9BFF;--color-info-bg:#1B2D4D;
  --cat-work:#6C9BFF;--cat-study:#9D8FF0;--cat-personal:#F5B85A;
  --nav-bg:#0B1A2B;--on-primary:#0E1624;--scrim:rgba(0,0,0,.6);
  --shadow-1:none;--shadow-2:none;--shadow-3:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --color-primary-600:#6C9BFF;--color-primary-100:#1B2D4D;--color-accent-500:#F5B85A;--color-accent-100:#3A2E17;
  --color-ink:#EEF1F6;--color-gray-700:#C5CCD6;--color-gray-500:#9AA4B2;--color-gray-300:#2C3A4D;--color-gray-100:#1E2A3B;
  --color-canvas:#0E1624;--color-surface:#16202F;
  --color-success:#4CC38A;--color-success-bg:#143326;--color-warning:#E0A64B;--color-warning-bg:#3A2E17;
  --color-error:#F07A7A;--color-error-bg:#3D1C1F;--color-info:#6C9BFF;--color-info-bg:#1B2D4D;
  --cat-work:#6C9BFF;--cat-study:#9D8FF0;--cat-personal:#F5B85A;
  --nav-bg:#0B1A2B;--on-primary:#0E1624;--scrim:rgba(0,0,0,.6);
  --shadow-1:none;--shadow-2:none;--shadow-3:none;color-scheme:dark}

[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--color-canvas);color:var(--color-ink);font-family:var(--font-body);font-size:15px;line-height:22px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-heading);margin:0;text-wrap:balance;color:var(--color-ink)}
h1{font-size:var(--fs-h1);line-height:1.3;font-weight:700;letter-spacing:-.3px}
h2{font-size:var(--fs-h2);line-height:1.4;font-weight:600;letter-spacing:-.2px}
h3{font-size:17px;line-height:24px;font-weight:600}
p{margin:0}
.caption{font-size:13px;line-height:18px;color:var(--color-gray-500)}
.overline{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--color-gray-500)}
.num{font-variant-numeric:tabular-nums}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.icon-16{width:16px;height:16px}.icon-24{width:24px;height:24px}.icon-32{width:32px;height:32px}
:focus-visible{outline:2px solid var(--color-primary-600);outline-offset:2px;box-shadow:0 0 0 4px var(--color-primary-100)}

/* ---------- estructura ---------- */
.app{display:flex;min-height:100%}
.sidebar{display:none}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--color-canvas);border-bottom:1px solid var(--color-gray-300);
  padding-block:var(--space-3);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:var(--space-4)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--color-canvas)}
.brand{text-decoration:none;display:flex;align-items:center;gap:var(--space-2);font-family:var(--font-heading);font-weight:700;font-size:20px;letter-spacing:-.3px;color:var(--color-primary-900)}
.brand-mark{width:28px;height:28px;border-radius:var(--radius-md);background:var(--color-primary-900);display:grid;place-items:center;position:relative}
.brand-mark::after{content:"";width:8px;height:8px;border-radius:var(--radius-full);background:var(--color-accent-500);position:absolute;right:5px;top:5px}
.brand-mark span{color:#fff;font-size:15px;line-height:1}
:root[data-theme="dark"] .brand{color:var(--color-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{color:var(--color-ink)}}
.topbar .search{flex:1;max-width:420px;margin-left:auto}
main{flex:1;width:100%;max-width:1200px;margin:0 auto;padding-block:var(--space-6) calc(var(--space-16) + 64px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--color-surface);border-top:1px solid var(--color-gray-300);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:var(--space-2) 0;min-height:56px;justify-content:center;text-decoration:none;color:var(--color-gray-500);font-size:12px;line-height:16px;font-weight:500}
.bottomnav a[aria-current="page"]{color:var(--color-primary-600)}
.bottomnav a[aria-current="page"] .icon{fill:var(--color-primary-100)}

@media (min-width:768px){main{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}}
@media (min-width:1024px){
  .sidebar{display:flex;flex-direction:column;gap:var(--space-8);width:248px;flex:none;position:sticky;top:0;height:100vh;background:var(--nav-bg);color:var(--nav-fg);
    padding:var(--space-6) var(--space-4) var(--space-6) max(16px,env(safe-area-inset-left,0px))}
  .sidebar .brand{color:#fff;padding:0 var(--space-3)}
  .sidebar .brand-mark{background:var(--color-primary-600)}
  .snav{display:flex;flex-direction:column;gap:var(--space-1)}
  .snav a{display:flex;align-items:center;gap:var(--space-3);height:44px;padding:0 var(--space-3);border-radius:var(--radius-md);text-decoration:none;color:var(--nav-fg);font-size:14px;font-weight:500}
  .snav a:hover{background:var(--nav-hover);color:#fff}
  .snav a[aria-current="page"]{background:rgba(255,255,255,.12);color:var(--nav-active)}
  .snav .count{margin-left:auto;font-size:12px;color:var(--nav-fg)}
  .sidebar-foot{margin-top:auto;display:flex;flex-direction:column;gap:var(--space-3)}
  .gcal{border:1px solid rgba(255,255,255,.14);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
  .gcal .t{display:flex;align-items:center;gap:var(--space-2);color:#fff;font-size:14px;font-weight:600}
  .gcal p{font-size:13px;line-height:18px;color:var(--nav-fg)}
  .gcal button{height:36px;border-radius:var(--radius-md);border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--nav-fg);font-size:13px;font-weight:600;cursor:not-allowed}
  .bottomnav,.topbar .brand,.topbar .sync-pill-m{display:none}
  .topbar{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
  main{padding-block:var(--space-8) var(--space-12);padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
@media (max-width:1023px){.topbar .search{display:none}}

/* ---------- componentes ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:48px;padding:0 20px;border-radius:var(--radius-md);border:1px solid transparent;
  font-size:14px;line-height:20px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none;transition:background var(--duration-fast) var(--ease-out),filter var(--duration-fast) var(--ease-out)}
@media (min-width:1024px){.btn{height:40px}}
.btn-primary{background:var(--color-primary-600);color:var(--on-primary)}
.btn-primary:hover{filter:brightness(.92)}.btn-primary:active{filter:brightness(.86)}
.btn-secondary{background:var(--color-surface);color:var(--color-primary-600);border-color:var(--color-gray-300)}
.btn-secondary:hover{background:var(--color-primary-100)}
.btn-text{background:transparent;color:var(--color-primary-600);padding:0 var(--space-2);height:36px}
.btn-text:hover{background:var(--color-primary-100)}
.btn-danger{background:var(--color-error);color:#fff}.btn-danger:hover{filter:brightness(.92)}
.btn:disabled{background:var(--color-gray-100);color:var(--color-gray-500);border-color:transparent;cursor:not-allowed;filter:none}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-md);border:0;background:transparent;color:var(--color-gray-500);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--color-gray-100);color:var(--color-ink)}
.spinner{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.card{background:var(--color-surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-1);padding:var(--space-4)}
:root[data-theme="dark"] .card{border:1px solid var(--color-gray-300)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card{border:1px solid var(--color-gray-300)}}
@media (min-width:1024px){.card{padding:var(--space-6)}}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)}

.field{display:flex;flex-direction:column;gap:var(--space-2);min-width:0}
.field label,.label{font-size:14px;line-height:20px;font-weight:500;color:var(--color-gray-700)}
.input,.select,.textarea{width:100%;height:48px;padding:0 var(--space-4);background:var(--color-surface);border:1px solid var(--color-gray-300);border-radius:var(--radius-md);font-size:15px;color:var(--color-ink)}
.textarea{height:auto;min-height:96px;padding:var(--space-3) var(--space-4);resize:vertical;line-height:22px}
.input::placeholder,.textarea::placeholder{color:var(--color-gray-500)}
.input:focus,.select:focus,.textarea:focus{outline:none;border:2px solid var(--color-primary-600);box-shadow:0 0 0 2px var(--color-primary-100)}
.has-error .input,.has-error .select,.has-error .textarea{border:1.5px solid var(--color-error)}
.has-ask .input{border:1.5px solid var(--color-warning)}
.field .help{font-size:13px;line-height:18px;color:var(--color-gray-500)}
.field .err{font-size:13px;line-height:18px;color:var(--color-error);display:flex;gap:var(--space-1);align-items:flex-start}
.search{position:relative}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--color-gray-500);pointer-events:none}
.search .input{padding-left:44px;height:44px;background:var(--color-surface)}

.chip{display:inline-flex;align-items:center;gap:var(--space-1);height:28px;padding:0 var(--space-2);border-radius:var(--radius-sm);font-size:13px;line-height:18px;font-weight:500;white-space:nowrap}
.chip .icon{width:14px;height:14px}
.st-pendiente{background:var(--color-gray-100);color:var(--color-gray-700)}
.st-progreso,.st-info{background:var(--color-info-bg);color:var(--color-info)}
.st-completada,.st-confirmada{background:var(--color-success-bg);color:var(--color-success)}
.st-vencida{background:var(--color-error-bg);color:var(--color-error)}
.st-pronto{background:var(--color-warning-bg);color:var(--color-warning)}
.pr-alta{background:var(--color-accent-100);color:var(--color-ink)}
.pr-alta .icon{color:var(--color-accent-500);fill:var(--color-accent-500)}
.pr-media{background:var(--color-primary-100);color:var(--color-ink)}
.pr-baja{background:var(--color-gray-100);color:var(--color-gray-700)}

.filters{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.fchip{height:36px;padding:0 var(--space-3);border-radius:var(--radius-sm);border:1px solid var(--color-gray-300);background:var(--color-surface);font-size:14px;font-weight:500;color:var(--color-gray-700);cursor:pointer;display:inline-flex;align-items:center;gap:var(--space-2)}
.fchip[aria-pressed="true"]{background:var(--color-primary-100);border-color:var(--color-primary-600);color:var(--color-primary-600)}
.fchip .n{font-variant-numeric:tabular-nums;color:var(--color-gray-500)}
.fchip[aria-pressed="true"] .n{color:var(--color-primary-600)}

.seg{display:flex;gap:var(--space-2);flex-wrap:wrap}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{height:40px;padding:0 var(--space-4);display:inline-flex;align-items:center;gap:var(--space-2);border:1px solid var(--color-gray-300);border-radius:var(--radius-md);cursor:pointer;font-size:14px;font-weight:500;color:var(--color-gray-700);background:var(--color-surface)}
.seg input:checked+label{background:var(--color-primary-100);border-color:var(--color-primary-600);color:var(--color-primary-600)}
.seg input:focus-visible+label{outline:2px solid var(--color-primary-600);outline-offset:2px}

/* filas de registros */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-2) var(--space-3) var(--space-4);border-bottom:1px solid var(--color-gray-300);position:relative;min-height:64px}
.row:last-child{border-bottom:0}
.row::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:2px;background:var(--stripe)}
.a-trabajo{--stripe:var(--cat-work)}.a-estudios{--stripe:var(--cat-study)}.a-personal{--stripe:var(--cat-personal)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:15px;line-height:22px;font-weight:500;overflow-wrap:anywhere}
.row.done .row-title{color:var(--color-gray-500);text-decoration:line-through}
.row-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1) var(--space-3);font-size:13px;line-height:18px;color:var(--color-gray-500)}
.row-meta span{display:inline-flex;align-items:center;gap:var(--space-1)}
.row-meta .late{color:var(--color-error)}
.row-meta .soon{color:var(--color-warning)}
.row-tags{display:flex;gap:var(--space-2);flex-wrap:wrap;justify-content:flex-end}
.check{width:24px;height:24px;flex:none;border-radius:var(--radius-sm);border:1.5px solid var(--color-gray-500);background:var(--color-surface);display:grid;place-items:center;cursor:pointer;padding:0;position:relative}
.check::after{content:"";position:absolute;inset:-10px}
.check:hover{border-color:var(--color-primary-600)}
.check.on{background:var(--color-success);border-color:var(--color-success);color:#fff}
.check .icon{width:16px;height:16px;stroke-width:2.5}
.timebox{width:56px;flex:none;text-align:center;border-radius:var(--radius-md);background:var(--color-primary-100);padding:var(--space-2) 0;display:flex;flex-direction:column}
.timebox b{font-family:var(--font-heading);font-size:20px;line-height:24px;font-weight:700;color:var(--color-primary-900)}
.timebox span{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--color-gray-700)}
:root[data-theme="dark"] .timebox b{color:var(--color-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .timebox b{color:var(--color-ink)}}
@media (max-width:639px){.row{flex-wrap:wrap}.row-tags{width:100%;justify-content:flex-start;padding-left:36px}.row.ev .row-tags{padding-left:68px}}

/* inicio */
.hello{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-6)}
.hello .date{color:var(--color-gray-500);font-size:15px}
.hello h1{font-size:var(--fs-display);line-height:1.25;letter-spacing:-.5px}
.capture-card{background:var(--color-primary-900);border-radius:var(--radius-lg);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-3);color:#fff}
.capture-card label{color:#fff;font-family:var(--font-heading);font-size:var(--fs-h2);line-height:1.4;font-weight:600}
.capture-card .help{color:#C9D6E6}
.capture-row{display:flex;gap:var(--space-3)}
.capture-row .input{background:#fff;color:#121826;border-color:transparent}
.capture-row .input::placeholder{color:#6B7280}
.capture-card .btn-primary{background:#2457C5;color:#fff}
.ex{display:flex;flex-wrap:wrap;gap:var(--space-2);align-items:center}
.ex button{height:32px;padding:0 var(--space-3);border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.22);background:transparent;color:#E6EEFB;font-size:13px;cursor:pointer}
.ex button:hover{background:rgba(255,255,255,.08)}
@media (max-width:639px){.capture-row{flex-direction:column}.capture-card{padding:var(--space-4)}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:var(--space-5);margin-block:var(--space-8)}
.stat{padding:var(--space-4) var(--space-5);display:flex;flex-direction:column;gap:var(--space-1)}
.stat .v{font-family:var(--font-heading);font-size:32px;line-height:40px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{display:flex;align-items:center;gap:var(--space-2);font-size:14px;color:var(--color-gray-700);font-weight:500}
.stat .k .dot{width:8px;height:8px;border-radius:50%;background:var(--d)}
.stat.late .v{color:var(--color-error)}
.progress{background:var(--color-accent-100)}
.bar{height:8px;border-radius:var(--radius-full);background:var(--color-surface);overflow:hidden;margin-top:var(--space-2)}
.bar i{display:block;height:100%;background:var(--color-accent-500);border-radius:var(--radius-full);transition:width var(--duration-base) var(--ease-out)}
@media (max-width:1023px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stats .progress{grid-column:1/-1}}
@media (max-width:479px){.stats{gap:var(--space-3)}.stat{padding:var(--space-3)}.stat .v{font-size:24px;line-height:32px}.stat .k{font-size:13px}}
.home-grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-6);align-items:start}

/* ================= planes: lógica pura (sin pantalla), probada en tests/planes.test.js =================
   Un plan guardado en el perfil se ve así:
   { id: "plus"|"estudiante"|"fundadora"|"gratis", estado: "prueba"|"activa"|"cancelada"|"vencida",
     periodo: "mensual"|"anual"|null, inicio, fin_periodo (AAAA-MM-DD, el primer día SIN Plus),

    const base = { ...plan, plus:true };
    if (plan.estado === "prueba" || plan.estado === "cancelada") return hoy < plan.fin_periodo ? base : gratis({ estado:"vencida", anterior:plan });
    if (plan.estado === "activa") {
      if (plan.pago_fallido_en) return hoy < plan.gracia_hasta ? { ...base, en_gracia:true } : gratis({ estado:"vencida", anterior:plan });
      return base;
    }
    return gratis({ estado:"vencida", anterior:plan });
  }
  const limite = ef => (C.planes[ef.id] || C.planes.gratis).capturas_mes;
  const usadas = (uso, hoy) => uso && uso.mes === mesDe(hoy) ? (uso.n || 0) : 0;
  const registrarUso = (uso, hoy) => ({ mes:mesDe(hoy), n:usadas(uso, hoy) + 1 });

  /* LA función de permisos: la usan la interfaz y cada acción antes de hacerla. */
  function puede(ef, accion, uso, hoy){

  }

    if (plan.id === "estudiante") return P.estudiante.mensual;

})();

const dateCtx = () => { const td = today(); return `Hoy es ${DOWL[fromIso(td).getDay()]} ${td} (formato AAAA-MM-DD), zona horaria ${tz()}.`; };
const DRAFT_SPEC = `- "tipo": elige con estas reglas, en este orden:

  · "reunion": un ENCUENTRO con otras personas en un momento: reunión, cita, junta, almuerzo o llamada CON alguien. Va a Agenda. Ej.: "almuerzo con Ana el sábado", "reunión con el equipo el jueves a las 10".

async function interpret(text, ia = true){

/* Control propio: si la IA marca como evento o reunión algo que empieza con una acción, es una tarea. */

/* patrones aprendidos y confirmados se aplican siempre */
function applyPatterns(out, text){
  const kw = keywords(text + " " + (out.draft.titulo || ""));
  memoria().filter(m => m.confirmado && m.regla && kw.includes(m.regla.kw)).forEach(m => {
    if (m.regla.campo === "prioridad" && PRIOS[m.regla.valor]) out.draft.prioridad = m.regla.valor;

/* ---------- patrones desde correcciones ---------- */
function pendingPattern(){
  const no = new Set(P_().patrones_no || []);

  const count = {};
  correcciones().filter(c => c.campo === "prioridad" || c.campo === "area").forEach(c => {
    keywords(c.titulo || c.texto).forEach(w => { const key = `${w}|${c.campo}|${c.final}`; count[key] = (count[key] || 0) + 1; });
  });
  const best = Object.entries(count).filter(([k, n]) => n >= 3 && !no.has(k) && !have.has(k)).sort((a, b) => b[1] - a[1])[0];
  if (!best) return null;
  const [kw, campo, valor] = best[0].split("|");
  const texto = campo === "prioridad" ? `¿Quieres que lo que tenga que ver con «${kw}» vaya siempre en prioridad ${PRIOS[valor].toLowerCase()}?` : `¿Quieres que lo que tenga que ver con «${kw}» vaya siempre en ${areaName(valor)}?`;

  return { key:best[0], kw, campo, valor, texto, contenido };
}

function readForm(px, base){

  const d = { ...base, titulo:v("titulo") ?? base.titulo, tipo:v("tipo") || base.tipo, area:v("area") || base.area,
    fecha:v("fecha") || null, hora:v("hora") || null, prioridad:pr ? pr.value : base.prioridad, descripcion:v("desc") ?? base.descripcion };
  const mt = v("meta"); if (mt !== undefined) d.meta_id = mt || null;
  const es = v("estado"); if (es) d.estado = es;
  if (d.tipo !== base.tipo && !es) d.estado = isEventLike(d) ? "confirmada" : "pendiente";

}

function obRead(){
  const v = S.ob.v, g = id => { const el = document.getElementById(id); return el ? el.value.trim() : null; };
  ["apodo","ocupacion","metas","trabajo","recarga","extra"].forEach(k => { const x = g("ob-" + k); if (x !== null) v[k] = x; });
}
async function memFromOb(key, categoria, contenido){
  const id = "mem-ob-" + key;
  if (!contenido) { if (S.docs.get(id)) await del(id); return; }
  await put(id, { k:"memoria", categoria, contenido:contenido.slice(0, 160), fuente:"entrevista", confirmado:true, creado:new Date().toISOString() });
}
async function obNext(skip = false){
  const o = S.ob, id = OB_STEPS[o.step], v = o.v;
  if (!skip) obRead();
  if (!skip && (id === "metas" || id === "recarga" || id === "extra") && !o.props) {
    const txt = v[id];
    if (txt) {
      o.busy = true; render();
      o.props = id === "metas" ? await proposeGoals(txt) : await proposeFacts(txt, id === "recarga" ? "Qué te recarga o te hace feliz" : "Algo más que quieras que sepa de ti");
      o.busy = false;
      if (o.props.length) { render(); return; }
      o.props = null;
    }
  }
  const now = new Date().toISOString(), data = { onboarding_paso:o.step + 1 };
  if (!skip) {
    if (id === "nombre") { data.apodo = v.apodo.slice(0, 40); }
    if (id === "ocupacion") { data.ocupacion_tipo = v.ocupacion_tipo; data.ocupacion = v.ocupacion; await memFromOb("ocupacion", "sobre_mi", [v.ocupacion_tipo, v.ocupacion].filter(Boolean).join(": ")); }
    if (id === "areas") { data.areas = v.areas.slice(); }
    if (id === "semana") {
      data.rutina = { trabajo:v.trabajo, clases:v.clases.slice(), momento:v.momento };
      await memFromOb("trabajo", "rutina", v.trabajo ? `Trabaja ${v.trabajo}` : "");
      await memFromOb("clases", "rutina", v.clases.length ? `Tiene clases los ${v.clases.join(", ")}` : "");
      await memFromOb("momento", "preferencias", v.momento ? `Prefiere planificar en la ${v.momento.toLowerCase() === "mediodía" ? "hora del almuerzo" : v.momento.toLowerCase()}` : "");
    }
    if (id === "tono") data.tono = v.tono;
    if (id === "autonomia") data.autonomia = v.autonomia;
    if (o.props) {
      const keep = $$("[data-prop]").filter(x => x.checked).map(x => o.props[+x.dataset.prop]);
      for (const it of keep) {
        if (id === "metas") await put(newId("m"), { k:"meta", titulo:it.titulo, area:it.area, tipo:it.tipo, frecuencia_semanal:it.frecuencia_semanal, fecha_objetivo:it.fecha_objetivo, estado:"activa", creado:now });
        else await put(newId("mem"), { k:"memoria", categoria:it.categoria, contenido:it.contenido, corto:it.corto || null, fuente:"entrevista", confirmado:true, creado:now });
      }
    }
  }
  await upd("perfil", data);
  o.step++; o.props = null; render(); window.scrollTo(0, 0);
  $("#ob-form input, #ob-form textarea, #ob-form button.chipsel, #ob-form .opt")?.focus({ preventScroll:true });
}

/* ================= metas ================= */
function weekCheckins(m){ const ws = weekStart(); return checkins().filter(c => c.meta_id === m.id && c.fecha >= ws && c.fecha <= addDays(ws, 6)); }
const checkedToday = m => checkins().some(c => c.meta_id === m.id && c.fecha === today());
function nextStep(m){ return recs().filter(r => r.meta_id === m.id && isTaskLike(r) && !isDone(r)).sort((a, b) => (a.fecha || "9999").localeCompare(b.fecha || "9999"))[0] || null; }
function goalCard(m, { compact = false } = {}){
  const paused = m.estado === "pausada", done = m.estado === "lograda";
  let prog = "", foot = "";
  if (m.tipo === "habito") {
    const n = weekCheckins(m).length, goal = m.frecuencia_semanal || 1, pct = Math.min(100, Math.round(n / goal * 100));
    prog = `<div class="gbar" role="progressbar" aria-label="Avance de la semana" aria-valuemin="0" aria-valuemax="${goal}" aria-valuenow="${n}"><i style="width:${pct}%"></i></div>`;
    foot = `<span class="caption num"><b style="color:var(--color-ink)">${n} de ${goal}</b> esta semana</span>
      ${paused || done ? "" : checkedToday(m) ? `<span class="chip st-completada">${ic("check")}Hoy ya cumpliste</span>` : `<button class="btn btn-secondary" data-act="checkin" data-meta="${esc(m.id)}">${ic("check")}Hoy fui</button>`}`;
  } else {
    const ns = nextStep(m), linked = recs().filter(r => r.meta_id === m.id && isTaskLike(r)), dn = linked.filter(isDone).length;
    if (linked.length) prog = `<div class="gbar" role="progressbar" aria-label="Pasos completados" aria-valuemin="0" aria-valuemax="${linked.length}" aria-valuenow="${dn}"><i style="width:${Math.round(dn / linked.length * 100)}%"></i></div>`;
    foot = `<span class="caption">${ns ? `Próximo paso: ${esc(ns.titulo)}${ns.fecha ? " · " + esc(fmtDate(ns.fecha)) : ""}` : m.fecha_objetivo ? `Para el ${esc(fmtDate(m.fecha_objetivo))}` : "Sin fecha objetivo"}</span>`;
  }
  return `<article class="goal a-${areaKey(m.area)} ${paused ? "paused" : ""}" data-meta-id="${esc(m.id)}">
    <div class="gh"><b>${esc(m.titulo)}</b>${done ? `<span class="chip st-lograda">${ic("trophy")}Lograda</span>` : paused ? `<span class="chip st-pendiente">${ic("pause")}Pausada</span>` : ""}
      ${compact ? "" : `<button class="icon-btn" data-act="meta-menu" data-meta="${esc(m.id)}" aria-label="Más acciones para la meta ${esc(m.titulo)}" aria-haspopup="menu">${ic("more")}</button>`}</div>
    <span class="overline">${m.tipo === "habito" ? "Hábito" : "Proyecto"} · ${esc(areaName(m.area))}</span>
    ${prog}<div class="gfoot">${foot}</div></article>`;
}

function greeting(){
  const h = nowParts().hour, td = today();
  const saludo = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";
  const nm = nombre();
  const s = daySummary(), pend = s.dueToday.length + s.evs.length;
  const corto = memoria().filter(m => m.confirmado && m.corto && (m.categoria === "gustos" || m.categoria === "personas_y_mascotas"));
  const doy = Math.floor((fromIso(td) - new Date(fromIso(td).getFullYear(), 0, 0)) / 864e5);
  let line;
  const p = P_();
  const toqueHoy = p.toque && p.toque.fecha === td;
  const puedeToque = corto.length && (!p.toque || toqueHoy || p.toque.fecha !== td);
  if (puedeToque && (toqueHoy || doy % 2 === 0) && !directo()) {
    const c = toqueHoy ? p.toque.texto : corto[doy % corto.length].corto;
    line = pend ? `Te ${pend === 1 ? "queda un pendiente" : `quedan ${numw(pend)} pendientes`} y luego, un rato para ${c}.` : `Hoy no hay pendientes. ¿Qué tal un rato para ${c}?`;
    if (!toqueHoy && S.loaded && S.toqueSent !== td) { S.toqueSent = td; setTimeout(() => upd("perfil", { toque:{ fecha:td, texto:c } }), 0); }
  } else {
    const opts = directo()
      ? [pend ? `${plural(pend, "cosa", "cosas")} para hoy.` : "Nada para hoy."]
      : pend
        ? [`Vamos por partes: hoy ${pend === 1 ? "tienes una cosa" : `tienes ${numw(pend)} cosas`} en agenda.`, `Hoy ${pend === 1 ? "hay un pendiente" : `hay ${numw(pend)} pendientes`}. Empecemos por lo más importante.`, `Ya tengo tu día ordenado: ${plural(pend, "cosa", "cosas")} para hoy.`]
        : ["Hoy tienes el día libre de pendientes. ¿Planificamos algo para ti?", "Día tranquilo. Buen momento para avanzar en tus metas.", "Nada urgente por hoy. Tú decides en qué usar el día."];
    line = opts[doy % opts.length];
  }
  return { saludo:`${saludo}${nm ? ", " + nm : ""}`, line };
}

/* ================= tarjetas de Arlet ================= */
function levelProposal(){
  const p = P_();
  if ((p.autonomia || 1) !== 1 && esPlus()) return false;
  if (nivel() !== 1) return false;
  if (p.prop_nivel && diffDays(today(), p.prop_nivel) < 7) return false;
  const conf = recs().filter(r => r.origen === "captura").sort((a, b) => (b.creado || "").localeCompare(a.creado || "")).slice(0, 15);
  return conf.length >= 15 && conf.filter(r => r.sin_cambios).length >= 12;
}
/* avisos de Plus: como máximo uno al día, y nunca dentro del diario */
function nudgeOk(ctx){ const a = P_().aviso_plus, td = today(); return !a || a.fecha !== td || a.ctx === ctx; }
function markNudge(ctx){ const td = today(), a = P_().aviso_plus; if ((a && a.fecha === td) || S.nudgeSent === td || !S.loaded) return; S.nudgeSent = td; setTimeout(() => upd("perfil", { aviso_plus:{ fecha:td, ctx } }), 0); }

const ahoraNo = `<button class="btn btn-text" data-act="nudge-no">Ahora no</button>`;
function planCard(){
  const p = P_(), ef = planEf(), td = today(), C = ARLET_CONFIG;
  if (ef.en_gracia) return card("alert", "No pude renovar tu Plus", `Puede ser un tema de la tarjeta. Revisa tu medio de pago cuando puedas: mantienes Plus hasta el ${esc(fmtDate(addDays(ef.gracia_hasta, -1)))}.`, `<a class="btn btn-secondary" href="#cuenta">Ver mi plan</a>`);
  const pl = p.plan;
  if (pl && pl.estado === "prueba" && ef.plus) {
    const n = PL.diasRestantes(pl, td);
    if (n <= C.prueba.aviso_dias_antes && nudgeOk("prueba")) { markNudge("prueba");
      return card("heart", n === 1 ? "Te queda 1 día de Plus. ¿Seguimos juntas?" : `Te quedan ${n} días de Plus. ¿Seguimos juntas?`, "Si no eliges un plan, pasas a Gratis y todo lo tuyo se queda contigo. Lo de Plus queda en solo lectura.", verPlus() + ahoraNo, true); }
  }
  if (ef.estado === "vencida" && ef.anterior && ef.anterior.fin_periodo && diffDays(td, ef.anterior.fin_periodo) <= 3 && nudgeOk("fin")) { markNudge("fin");
    return card("info", ef.anterior.estado === "prueba" ? "Terminó tu prueba de Plus" : "Tu Plus terminó", "Todo lo tuyo sigue aquí. Tus metas, hábitos y lo que aprendí de ti quedan en solo lectura hasta que vuelvas a Plus.", verPlus() + ahoraNo); }
  if (!ef.plus) {
    const u = PL.usadas(p.uso, td), l = PL.limite(ef);
    if (u >= l && nudgeOk("uso")) { markNudge("uso"); return card("capture", `Este mes ya usaste tus ${l} capturas con IA`, "Puedes seguir escribiendo a mano o pasarte a Plus.", verPlus("Ver Plus") + ahoraNo); }
    if (u >= C.aviso_capturas_en && nudgeOk("uso")) { markNudge("uso"); return card("capture", `Llevas ${u} de ${l} capturas con IA este mes`, `Te quedan ${l - u}. Con Plus no tienes que contarlas.`, verPlus("Ver Plus") + ahoraNo); }

}
function arletCards(){
  const out = [], p = P_(), dow = fromIso(today()).getDay();

/* ================= tareas ================= */
function filteredTasks(){
  const t = S.tasks, q = norm(t.q.trim());
  return recs().filter(isTaskLike).filter(r => {
    if (q && !norm(r.titulo + " " + (r.descripcion || "")).includes(q)) return false;
    if (t.prioridad !== "todas" && r.prioridad !== t.prioridad) return false;
    if (t.area !== "todas" && areaKey(r.area) !== t.area) return false;
    if (t.meta !== "todas" && (r.meta_id || "") !== (t.meta === "sin" ? "" : t.meta)) return false;
    if (t.estado === "activas") return !isDone(r);
    if (t.estado === "pendiente") return r.estado === "pendiente" && !isLate(r);
    if (t.estado === "en_progreso") return r.estado === "en_progreso" && !isLate(r);
    if (t.estado === "vencidas") return isLate(r);
    if (t.estado === "completada") return isDone(r);
    return true;
  });
}
function sortTasks(list){
  const o = S.tasks.orden;
  return list.sort((a, b) => o === "prioridad"
    ? PRANK[a.prioridad] - PRANK[b.prioridad] || (a.fecha || "9999").localeCompare(b.fecha || "9999")
    : (a.fecha || "9999").localeCompare(b.fecha || "9999") || PRANK[a.prioridad] - PRANK[b.prioridad]);
}
function tasksListHTML(){
  if (!S.loaded) return `<div class="card">${loadingRows()}</div>`;
  const list = filteredTasks(), td = today();
  if (!list.length) {
    const any = recs().some(isTaskLike);
    return `<div class="card">${any ? emptyState("search","Sin resultados","Nada coincide con estos filtros. Prueba con otra búsqueda o quita algún filtro.",`<button class="btn btn-secondary" data-act="clear-filters">Quitar filtros</button>`)
      : emptyState("tasks","Aún no tienes tareas","¿Planificamos tu día? Escríbeme lo que necesitas hacer en Capturar.",`<a class="btn btn-secondary" href="#capturar">Ir a Capturar</a>`)}</div>`;
  }
  const groups = [
    ["Atrasadas", r => isLate(r)], ["Hoy y mañana", r => !isDone(r) && !isLate(r) && r.fecha && diffDays(r.fecha, td) <= 1],
    ["Próximas", r => !isDone(r) && r.fecha && diffDays(r.fecha, td) > 1], ["Sin fecha", r => !isDone(r) && !r.fecha], ["Completadas", isDone]
  ];
  return groups.map(([name, fn]) => { const g = sortTasks(list.filter(fn)); if (!g.length) return "";
    return `<section class="group"><div class="group-h"><h3>${name}</h3><span class="n">${g.length}</span></div><div class="card" style="padding-block:4px"><div class="list">${g.map(r => taskRow(r)).join("")}</div></div></section>`; }).join("");
}

/* ================= mi vida ================= */
function weekBalance(){
  const ws = weekStart(), we = addDays(ws, 6), c = {};
  recs().filter(r => { const d = r.fecha || isoDay(r.creado); return d >= ws && d <= we; }).forEach(r => { const a = areaKey(r.area); c[a] = (c[a] || 0) + 1; });
  checkins().filter(x => x.fecha >= ws && x.fecha <= we).forEach(x => { const m = S.docs.get(x.meta_id); const a = areaKey(m ? m.area : "personal"); c[a] = (c[a] || 0) + 1; });
  const total = Object.values(c).reduce((a, b) => a + b, 0);
  return { c, total };
}
function balancePhrase(b){
  if (b.total < 5) return "";
  const top = Object.entries(b.c).sort((x, y) => y[1] - x[1])[0];
  if (top[1] / b.total < 0.7) return say("Tu semana está bastante repartida. Buen equilibrio.", "Semana equilibrada.");
  if (top[0] === "trabajo") return "Esta semana casi todo fue trabajo. ¿Te guardas un rato para ti?";
  if (top[0] === "estudios") return "Esta semana casi todo fue estudio. ¿Te guardas un rato para descansar?";
  return `Esta semana casi todo fue ${areaName(top[0]).toLowerCase()}. ¿Hay algo de otra área que quieras mover?`;
}

  return head + tabs + ro + (tab === "diario" ? viewDiario() : tab === "notas" ? viewNotas() : viewAreas());

let adminSubs = null;
function adminSubscribe(){
  if (adminSubs || !db || !S.canEdit) return;
  adminSubs = [];
  const t = setTimeout(() => { S.admin.loaded = true; softRender(); }, 10000);
  adminSubs.push(db.collection("cuentas").onSnapshot(s => { clearTimeout(t); S.admin.cuentas = s.docs.map(x => ({ id:x.id, ...x.data() })); S.admin.loaded = true; resolveProfiles(); softRender(); }, () => { S.admin.loaded = true; softRender(); }));
  adminSubs.push(db.collection("estados").onSnapshot(s => { S.admin.estados = Object.fromEntries(s.docs.map(x => [x.id, x.data()])); softRender(); }, () => {}));
  adminSubs.push(db.collection("admin_log").orderBy("fecha", "desc").limit(200).onSnapshot(s => { S.admin.log = s.docs.map(x => ({ id:x.id, ...x.data() })); resolveProfiles(); softRender(); }, () => {}));
}
async function resolveProfiles(){
  if (!userNs) return;
  const ids = new Set(S.admin.cuentas.map(c => c.id)); S.admin.log.forEach(l => { ids.add(l.admin); ids.add(l.objetivo); });
  const need = [...ids].filter(i => i && !S.admin.profiles[i]);
  if (!need.length) return;
  try { const ps = await userNs.profiles(need); Object.assign(S.admin.profiles, ps); softRender(); } catch(e){}
}
const pName = id => (S.admin.profiles[id] && S.admin.profiles[id].name) || (id === S.uid ? (nombre() || "Tú") : "Persona sin nombre visible");
const pMail = id => (S.admin.profiles[id] && S.admin.profiles[id].email) || "";
const fmtTs = ts => ts ? fmtDate(isoDay(ts)) : "—";

  if (S.mode === "local") return `<div class="page-head"><div><h1>Administración</h1><p>El panel funciona cuando Arlet está publicada en claude.ai.</p></div></div>`;

const resetCap = (text = "") => { S.cap = { text, phase:"idle", draft:null, orig:null, source:null, question:null, missing:[], errors:{}, raw:"", conf:0 }; };
function mustAsk(out){
  const lvl = nivel(), d = out.draft;
  if (lvl === 1 || out.source !== "ia" || out.missing.length) return true;
  if (out.conf < (lvl === 2 ? 0.85 : 0.7)) return true;
  if (d.tipo === "checkin") return false;
  if (conflictOf(d)) return true;
  const R = recs().filter(r => r.origen !== "ejemplo");
  if (!R.some(r => r.tipo === d.tipo) || !R.some(r => areaKey(r.area) === areaKey(d.area))) return true;
  return false;
}
async function startCapture(text){
  text = text.trim(); if (!text) return;
  const from = S.view;
  S.cap = { text, raw:text, phase:"loading", draft:null, orig:null, source:null, question:null, missing:[], errors:{}, conf:0 };
  if (S.view !== "capturar") go("capturar"); else render();
  const q = puede("captura_ia");
  const items = await interpretAll(text, q.ok);
  if (S.cap.raw !== text) return;
  if (items.some(x => x.source === "ia")) await contarCaptura();
  if (items.length > 1) {
    S.cap = { ...S.cap, phase:"multi", limite:!q.ok };
    S.dump = { text, phase:"done", items:items.map(x => ({ ...x, sel:true, saved:false })) };
    render(); $("#h-multi")?.scrollIntoView({ block:"start", behavior:"smooth" }); return;
  }
  const out = items[0];
  if (!mustAsk(out)) { resetCap(); await autoSave(out); if (from === "inicio") go("inicio"); else render(); return; }
  S.cap = { ...S.cap, limite:!q.ok, phase:"confirm", draft:out.draft, orig:{ ...out.draft }, source:out.source, conf:out.conf, question:out.question || askFor(out.draft, out.missing), missing:out.missing };
  render();
  const first = out.missing[0]; document.getElementById(first ? `cf-${first}` : "cf-titulo")?.focus({ preventScroll:false });
}
async function autoSave(out){
  const d = out.draft;
  if (d.tipo === "checkin") return doCheckin(d.meta_id);
  const id = newId(), rec = buildRecord({ ...d, origen:"auto", confianza_ia:out.conf });
  if (await put(id, rec)) toast(say(`Listo, guardé «${rec.titulo}»${rec.fecha ? " para el " + fmtDate(rec.fecha) : ""}.`, `Guardado${rec.fecha ? " para el " + fmtDate(rec.fecha) : ""}.`), "ok", { label:"Deshacer", fn:async () => { if (await del(id)) toast("Listo, lo deshice.", "ok"); }, ms:10000 });
}
async function confirmCapture(){
  const d = readForm("cf", S.cap.draft);
  const errors = validate(d, true);
  S.cap.draft = d;
  if (Object.keys(errors).length) { S.cap.errors = errors; render(); const k = Object.keys(errors)[0]; document.getElementById(`cf-${k}`)?.focus(); return; }
  const o = S.cap.orig || {}, changed = ["tipo","titulo","fecha","hora","prioridad","area"].filter(k => (o[k] || null) !== (d[k] || null));
  const id = newId(), rec = buildRecord({ ...d, origen:"captura", confianza_ia:S.cap.conf, sin_cambios:changed.length === 0 });
  const btn = $("#conf-form button[type=submit]"); if (btn) { btn.disabled = true; btn.innerHTML = `<span class="spinner"></span>Guardando…`; }
  const raw = S.cap.raw;
  if (await put(id, rec)) {
    for (const k of changed.filter(k => k !== "titulo")) await put(newId("x"), { k:"correccion", campo:k, propuesto:o[k] || null, final:d[k] || null, texto:raw.slice(0, 200), titulo:rec.titulo, creado:new Date().toISOString() });
    toast(say(`Listo, ${lo(rec.tipo)} guardé${rec.fecha ? " para el " + fmtDate(rec.fecha) : ""}.`, `${cap1(guardad(rec.tipo))}${rec.fecha ? " para el " + fmtDate(rec.fecha) : ""}.`), "ok");
    resetCap();
    if (isEventLike(rec) && rec.fecha) { const d2 = fromIso(rec.fecha); S.agenda = { y:d2.getFullYear(), m:d2.getMonth(), sel:rec.fecha }; }
    if (rec.tipo === "nota") S.vida.tab = "notas";

async function saveDump(){
  const its = S.dump.items.filter(x => x.sel && !x.saved);
  let n = 0;
  for (const it of its) {
    const d = it.draft;
    if (d.tipo === "checkin") { await doCheckin(d.meta_id); it.saved = true; n++; continue; }

  }
  if (S.dump.items.every(x => x.saved || !x.sel)) S.cap.text = "";
  render();

document.addEventListener("click", async e => {
  const t = e.target, menu = $("#menu");

    case "pat-yes": { if (!gate("memoria_aprende")) break; const p = pendingPattern(); if (p) { await put(newId("mem"), { k:"memoria", categoria:"patrones", contenido:p.contenido, regla:{ kw:p.kw, campo:p.campo, valor:p.valor }, fuente:"correccion", confirmado:true, creado:new Date().toISOString() }); toast(say("Listo, lo voy a recordar.", "Guardado."), "ok"); } break; }
    case "pat-no": { const p = pendingPattern(); if (p) await upd("perfil", { patrones_no:[...(P_().patrones_no || []), p.key] }); break; }
    case "plan-week": await upd("perfil", { plan_semana:weekStart() }); go("capturar"); break;
    case "plan-no": await upd("perfil", { plan_semana:weekStart() }); break;
    case "ob-back": S.ob.step = Math.max(0, S.ob.step - 1); S.ob.props = null; render(); break;
    case "ob-skip": obNext(true); break;
    case "ob-later": await upd("perfil", { onboarding_saltado:true }); go("inicio"); break;
    case "ob-finish": { const nuevo = !P_().plan; await upd("perfil", { onboarding_completo:true, onboarding_saltado:false, ...(nuevo ? { plan:PL.normalizar(PL.iniciarPrueba(null, today())) } : {}) }); S.ob = null; go("inicio");
      if (nuevo) toast(say(`Te regalo ${ARLET_CONFIG.prueba.dias} días de Plus, sin tarjeta. Disfrútalos.`, `${ARLET_CONFIG.prueba.dias} días de Plus activados.`), "ok"); break; }
    case "nudge-no": await upd("perfil", { aviso_plus:{ fecha:today(), ctx:"descartado" } }); break;
    case "precio-per": S.precioPeriodo = b.dataset.val; render(); document.querySelector(`[data-act="precio-per"][data-val="${b.dataset.val}"]`)?.focus(); break;
    case "elegir-plan": openPlan(b.dataset.plan); break;
    case "plan-go": activarPlan(); break;
    case "plan-per": planFlow.periodo = b.dataset.val; drawPlan(); break;
    case "plan-cancel": { const pl = P_().plan; openConfirm({ title: pl.estado === "prueba" ? "¿Cancelar tu prueba de Plus?" : "¿Cancelar Plus?", danger:false, cancel: pl.estado === "prueba" ? "Seguir probando" : "Seguir con Plus", ok:"Sí, cancelar",
      text:`Mantienes Plus hasta el ${ultimoDia(pl)} y no se te vuelve a cobrar. Tus datos se quedan contigo: después, lo de Plus pasa a solo lectura.`,
      onOk:async () => { if (await setPlan(PL.cancelar(pl, today()))) toast(say(`Listo, cancelado. Sigues con Plus hasta el ${ultimoDia(pl)}. Aquí estaré si quieres volver.`, "Plus cancelado."), "ok"); } }); break; }
    case "demo-reject": await setPlan(PL.pagoRechazado(P_().plan, today())); toast("Simulé un pago rechazado. Mira el aviso en Inicio.", "ok"); break;
    case "demo-approve": await setPlan(PL.pagoAprobado(P_().plan, today())); toast("Simulé un pago aprobado. Todo en orden.", "ok"); break;
    case "demo-grace": await setPlan({ ...P_().plan, gracia_hasta:today() }); toast("Terminaron los días de gracia: la cuenta pasó a Gratis sin perder datos.", "ok"); break;
    case "demo-end": { const pl = { ...P_().plan, fin_periodo:today() }; await setPlan(PL.renovar(pl, today())); toast(pl.estado === "activa" && !pl.pago_fallido_en ? "Simulé la renovación automática del periodo." : "El periodo terminó: la cuenta pasó a Gratis sin perder datos.", "ok"); break; }
    case "demo-3d": await setPlan({ ...P_().plan, fin_periodo:addDays(today(), ARLET_CONFIG.prueba.aviso_dias_antes) }); await upd("perfil", { aviso_plus:null }); toast("Listo: te quedan 3 días de prueba. Mira Inicio.", "ok"); break;
    case "demo-uso": { const u = P_().uso, n = PL.usadas(u, today()) + 5; await upd("perfil", { uso:{ mes:PL.mesDe(today()), n }, aviso_plus:null }); toast(`Ahora llevas ${n} capturas con IA este mes.`, "ok"); break; }
    case "demo-trial": await setPlan(PL.iniciarPrueba(null, today())); toast(`Empezó tu prueba de ${ARLET_CONFIG.prueba.dias} días.`, "ok"); break;
    case "st-send": stSend(); break;
    case "st-verify": stVerify(); break;
    case "dump-clear": S.dump = { text:"", phase:"idle", items:[] }; resetCap(); render(); $("#cap-text")?.focus(); break;
    case "dump-save": saveDump(); break;
    case "dump-edit": { const i = +b.dataset.i, it = S.dump.items[i]; if (it.draft.tipo === "checkin") { await doCheckin(it.draft.meta_id); it.saved = true; render(); } else openEditor({ ...it.draft, estado: isEventLike(it.draft) ? "confirmada" : "pendiente" }, true, { dumpIndex:i, origen:"captura" }); break; }
    case "dy-task": { if (!gate("diario_propuestas")) break; const tk = S.diary.reply.tareas[+b.dataset.i]; if (await put(newId(), buildRecord({ ...tk, origen:"diario" }))) { tk.done = true; render(); toast(say(`Listo, agregué «${tk.titulo}».`, "Agregado."), "ok"); } break; }
    case "dy-task-no": S.diary.reply.tareas[+b.dataset.i].done = true; render(); break;
    case "dy-mem": { if (!gate("diario_propuestas")) break; const m = S.diary.reply.recuerdos[+b.dataset.i]; if (await put(newId("mem"), { k:"memoria", categoria:m.categoria, contenido:m.contenido, fuente:"diario", confirmado:true, creado:new Date().toISOString() })) { m.done = true; render(); toast(say("Listo, lo voy a recordar.", "Guardado."), "ok"); } break; }
    case "dy-mem-no": S.diary.reply.recuerdos[+b.dataset.i].done = true; render(); break;
    case "dy-del": { const did = b.dataset.idD; openConfirm({ title:"¿Eliminar esta entrada?", text:"Se borrará de tu diario y no podrás recuperarla.", ok:"Eliminar", onOk:async () => { if (await del(did)) toast("Listo, la eliminé.", "ok"); } }); break; }
    case "mem-edit": S.acc.editMem = b.dataset.mem; accRead(); render(); $("#mem-edit")?.focus(); break;
    case "mem-cancel": S.acc.editMem = null; render(); break;
    case "mem-del": { const m = S.docs.get(b.dataset.mem); if (m && await del(m.id)) toast(say("Listo, ya no lo uso.", "Borrado."), "ok"); break; }
    case "mem-del-all": openConfirm({ title:"¿Borrar todo lo que sé de ti?", text:"Dejaré de usar todos tus recuerdos de inmediato. Tus registros, metas y diario se quedan.", ok:"Borrar todo", onOk:async () => { for (const m of memoria()) await del(m.id); toast("Listo, borré todo lo que sabía de ti.", "ok"); } }); break;
    case "set-level": { const v = +b.dataset.val; if (v > 1 && !gate("autonomia")) break; if (await upd("perfil", { autonomia:v })) toast(say(["", "Listo. Te pregunto todo antes de guardar.", "Listo. Guardo lo que tenga claro y te aviso.", "Listo. Confío en lo que tenga claro y te aviso siempre."][v], "Nivel actualizado."), "ok"); break; }
    case "acc-delete": openConfirm({ title:"¿Eliminar tu cuenta?", text:"Se borrarán para siempre tus registros, metas, diario y todo lo que sé de ti. No se puede deshacer.", ok:"Eliminar mi cuenta", typed:"ELIMINAR", onOk:deleteAccount }); break;
    case "adm-susp": { const u = b.dataset.uid; openConfirm({ title:"¿Suspender esta cuenta?", text:`${pName(u)} verá un aviso de cuenta pausada al entrar. Sus datos no se borran.`, ok:"Suspender", onOk:() => adminAction("suspender", u) }); break; }
    case "adm-react": { const u = b.dataset.uid; openConfirm({ title:"¿Reactivar esta cuenta?", text:`${pName(u)} podrá volver a entrar a su espacio.`, ok:"Reactivar", danger:false, onOk:() => adminAction("reactivar", u) }); break; }
    case "adm-role": modal(`<div class="modal-h"><h2 id="md-h">Cambiar rol</h2><button class="icon-btn" data-act="close" aria-label="Cerrar">${ic("x")}</button></div>
      <p style="color:var(--color-gray-700)">En esta versión de prueba, los roles se manejan desde el botón Compartir de claude.ai:</p>
      <ul style="color:var(--color-gray-700);padding-left:20px;display:flex;flex-direction:column;gap:8px;margin:12px 0"><li><b>Admin:</b> dale acceso de Editor. Verá este panel, pero nunca el contenido privado de nadie.</li><li><b>Usuaria:</b> dale acceso de Colaborador (Contributor), para que pueda guardar sus datos.</li></ul>
      <p class="caption">Así nadie puede darse permisos por su cuenta desde Arlet.</p>
      <div class="form-foot"><button class="btn btn-primary" data-act="close">Entendido</button></div>`, true); break;
  }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === "quick-form") { const v = $("#quick").value.trim(); if (!v) { $("#quick-err").textContent = "Escribe algo para organizar, por ejemplo una tarea o una reunión."; $("#quick").focus(); return; } startCapture(v); }
  if (f.id === "cap-form") { const v = $("#cap-text").value.trim(); if (!v) { $("#cap-help").textContent = "Escribe algo para organizar, por ejemplo una tarea o una reunión."; $("#cap-help").style.color = "var(--color-error)"; $("#cap-text").focus(); return; } startCapture(v); }
  if (f.id === "conf-form") confirmCapture();
  if (f.id === "ed-form") saveEditor();
  if (f.id === "meta-form") saveMeta();
  if (f.id === "diary-form") saveDiary();
  if (f.id === "ob-form") obNext(false);
  if (f.id === "acc-form") saveAccount();
  if (f.id === "link-form") { const rid = f.dataset.id, v = $("#lk-meta").value || null; closeLayer(); upd(rid, { meta_id:v }).then(ok => ok && toast(v ? say("Listo, lo vinculé a tu meta.", "Vinculado.") : "Listo, lo desvinculé.", "ok")); }
  if (f.id === "mem-form") { const v = $("#mem-edit").value.trim(), mid = f.dataset.mem; if (!v) { toast("Escribe el recuerdo o bórralo.", "err"); return; } S.acc.editMem = null; upd(mid, { contenido:v.slice(0, 160), fuente:"manual", confirmado:true }).then(ok => ok && toast("Listo, lo actualicé.", "ok")); }
  if (f.id === "mem-add") { const v = $("#mem-new").value.trim(); if (!v) { toast("Escribe lo que quieres que recuerde.", "err"); $("#mem-new").focus(); return; } accRead(); put(newId("mem"), { k:"memoria", categoria:$("#mem-cat").value, contenido:v.slice(0, 160), fuente:"manual", confirmado:true, creado:new Date().toISOString() }).then(ok => ok && toast(say("Listo, lo voy a recordar.", "Guardado."), "ok")); }
});
let tq;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "cap-text") S.cap.text = t.value;
  if (t.id === "quick") { S.cap.text = t.value; $("#quick-err").textContent = ""; }
  if (t.id === "dump-text") S.dump.text = t.value;
  if (t.id === "dy-text") S.diary.text = t.value;
  if (t.id === "cf-typed") { const okb = $("[data-act=confirm-ok]"); if (okb) okb.disabled = t.value.trim().toUpperCase() !== t.dataset.typed; }
  if (t.id === "t-q") { S.tasks.q = t.value; clearTimeout(tq); tq = setTimeout(() => { $("#t-list").innerHTML = tasksListHTML(); }, 120); }
  if (t.id === "n-q") { S.notes.q = t.value; clearTimeout(tq); tq = setTimeout(() => { $("#n-list").innerHTML = notesHTML(); }, 120); }
  if (t.id === "adm-q") { S.admin.q = t.value; clearTimeout(tq); tq = setTimeout(() => { render(); }, 150); }
  if (t.id === "gsearch") { S.gsearch = t.value; clearTimeout(tq); tq = setTimeout(render, 150); }
  if (t.id && t.id.startsWith("cf-") && S.cap.draft && t.id !== "cf-typed") S.cap.draft = readForm("cf", S.cap.draft);
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "t-prio") { S.tasks.prioridad = t.value; render(); }
  if (t.id === "t-area") { S.tasks.area = t.value; render(); }
  if (t.id === "t-meta") { S.tasks.meta = t.value; render(); }
  if (t.id === "t-orden") { S.tasks.orden = t.value; render(); }
  if (t.id === "cf-tipo" || t.id === "cf-fecha" || t.id === "cf-hora") {
    const d = readForm("cf", S.cap.draft); S.cap.draft = d;
    const f = finishDraft(d); S.cap.missing = f.missing; S.cap.question = f.missing.length ? askFor(d, f.missing) : null;
    if (S.cap.errors.fecha && d.fecha) delete S.cap.errors.fecha;
    render();
  }
  if (t.id === "cf-titulo" && S.cap.errors.titulo && t.value.trim()) delete S.cap.errors.titulo;
  if (t.id === "ed-tipo" && editState) { editState.base = readForm("ed", editState.base); drawEditor(); }
  if (t.name === "mt-tipo" && metaEdit) { readMeta(); drawMeta(); $(`#mt-tipo-${metaEdit.tipo === "habito" ? "h" : "p"}`)?.focus(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#layer").innerHTML) { const opener = $("#menu")?._opener; closeLayer(); editState = null; metaEdit = null; opener?.focus(); }
  if ($("#menu") && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault(); const bs = [...$("#menu").querySelectorAll("button")]; const i = bs.indexOf(document.activeElement);
    bs[(i + (e.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
  }
});
window.addEventListener("hashchange", route);
window.addEventListener("resize", () => { if ($("#menu")) closeLayer(); });

route();
initStore();
})();
</script>
